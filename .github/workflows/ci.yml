name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - name: Version in script header matches package.json
        run: |
          H=$(grep -m1 '@version' torn-travel-arcade.user.js | awk '{print $3}')
          P=$(node -p "require('./package.json').version")
          [ "$H" = "$P" ] || { echo "Header $H != package.json $P"; exit 1; }
